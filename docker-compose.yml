# ════════════════════════════════════════════════════════════════
# 查帳憑證核對系統 — Docker Compose（Supabase 版）
# ════════════════════════════════════════════════════════════════
# 資料庫和檔案儲存均使用 Supabase 雲端服務，本機只需跑 app
# 開發：docker compose up
# 部署：scp 整個資料夾到 Linux 主機後 docker compose up -d
# ════════════════════════════════════════════════════════════════

services:
  # ─────────────────────────────────────────────────────────────
  # Node.js 後端 + 前端
  # ─────────────────────────────────────────────────────────────
  app:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: audit-app
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      # Supabase PostgreSQL 連線
      PGHOST: ${PGHOST}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${PGDATABASE:-postgres}
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD}
      # Supabase Storage（後端使用 Secret Key）
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
      # JWT
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-random-string-in-production-please-make-it-long}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-admin123}
      TZ: Asia/Taipei
    ports:
      - "${APP_PORT:-3000}:3000"
    networks:
      - audit_net

  # ─────────────────────────────────────────────────────────────
  # Cloudflare Tunnel（外網存取）
  # ─────────────────────────────────────────────────────────────
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: audit-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://app:3000
    depends_on:
      - app
    networks:
      - audit_net

networks:
  audit_net:
    driver: bridge
